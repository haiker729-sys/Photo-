name: Build & Publish Jummo Photos AI & Private Admin Panel APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Assemble Jummo-Photos-AI.apk & Private Jummo-Admin-Panel.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Debug Keystore (if needed)
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests (Main App & Admin Panel)
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest :admin:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest :admin:testDebugUnitTest
          fi

      - name: Build Both APKs (Jummo-Photos-AI.apk + Jummo-Admin-Panel.apk)
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug :admin:assembleDebug
          else
            gradle :app:assembleDebug :admin:assembleDebug
          fi

      - name: Verify & Package Public vs Private APK Assets
        run: |
          mkdir -p release-assets
          mkdir -p admin-private-assets

          # 1. Public User APK (Jummo Photos AI)
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: Expected public APK not found at $APK_SOURCE"
            exit 1
          fi
          cp "$APK_SOURCE" "release-assets/Jummo-Photos-AI.apk"
          sha256sum "release-assets/Jummo-Photos-AI.apk" > "release-assets/Jummo-Photos-AI.apk.sha256"

          # 2. Private Admin APK (Jummo Admin Panel — NEVER published to public GitHub Releases)
          ADMIN_APK_SOURCE="admin/build/outputs/apk/debug/admin-debug.apk"
          if [ ! -f "$ADMIN_APK_SOURCE" ]; then
            echo "ERROR: Expected Admin Panel APK not found at $ADMIN_APK_SOURCE"
            exit 1
          fi
          cp "$ADMIN_APK_SOURCE" "admin-private-assets/Jummo-Admin-Panel.apk"
          sha256sum "admin-private-assets/Jummo-Admin-Panel.apk" > "admin-private-assets/Jummo-Admin-Panel.apk.sha256"

          ls -lh release-assets/
          ls -lh admin-private-assets/

      - name: Upload Public Jummo-Photos-AI.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jummo-Photos-AI-APK
          path: |
            release-assets/Jummo-Photos-AI.apk
            release-assets/Jummo-Photos-AI.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Access-Controlled Jummo-Admin-Panel.apk Artifact (Short Retention)
        uses: actions/upload-artifact@v4
        with:
          name: Jummo-Admin-Panel-Private-APK
          path: |
            admin-private-assets/Jummo-Admin-Panel.apk
            admin-private-assets/Jummo-Admin-Panel.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish ONLY Public Jummo-Photos-AI.apk to GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.4.0-pro' }}
          name: "Jummo Photos AI v2.4.0 Pro Studio Edition"
          body: |
            ## Jummo Photos AI — Smart Event Photography Suite (v2.4.0 Pro)
            - **Public Direct APK Download**: `Jummo-Photos-AI.apk`
            - **Minimum Android Version**: Android 7.0+ (API 24 – API 36)
            - **Target SDK**: Android 16 (API 36)
            - **Included Features**:
              - Royal Purple Studio UI & Real-Time Event Sync
              - Automatic Background Upload via WorkManager & Google Drive
              - Instant Event QR Code Generation & Guest Consent Face Search
              - Photographer Website Customizer & Official GitHub Pages Guest Portal
            - **Security Note**: `Jummo-Admin-Panel.apk` is strictly excluded from public releases and public website pages.
          files: |
            release-assets/Jummo-Photos-AI.apk
            release-assets/Jummo-Photos-AI.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
