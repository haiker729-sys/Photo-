name: Build Jummo Photos AI APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Normalize Gradle & SDK Versions for Public GitHub Runners
        run: |
          # Replace AI Studio internal mirror versions with public Google Maven stable versions on CI
          sed -i 's/agp = ".*"/agp = "8.8.2"/' gradle/libs.versions.toml
          sed -i 's/kotlin = ".*"/kotlin = "2.1.10"/' gradle/libs.versions.toml
          sed -i 's/googleDevtoolsKsp = ".*"/googleDevtoolsKsp = "2.1.10-1.0.31"/' gradle/libs.versions.toml
          sed -i 's/coreKtx = ".*"/coreKtx = "1.15.0"/' gradle/libs.versions.toml
          sed -i 's/junitVersion = ".*"/junitVersion = "1.2.1"/' gradle/libs.versions.toml
          sed -i 's/espressoCore = ".*"/espressoCore = "3.6.1"/' gradle/libs.versions.toml
          sed -i 's/firebaseBom = ".*"/firebaseBom = "33.10.0"/' gradle/libs.versions.toml
          sed -i 's/googleServices = ".*"/googleServices = "4.4.2"/' gradle/libs.versions.toml
          sed -i 's/robolectric = ".*"/robolectric = "4.14.1"/' gradle/libs.versions.toml
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/' app/build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 35/' app/build.gradle.kts
          sed -i '/kotlin.compiler.execution.strategy=in-process/d' gradle.properties

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Debug Keystore & Environment
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Jummo Photos AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jummo-Photos-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
